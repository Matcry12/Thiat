     brackets, button, slot, hpBar, bossBar, ...) is read from tools/ui_mock/index.html at load time and patched in memory
     (mock file is never edited): ctx becomes `let`, text is skipped (Godot draws the words), bars can draw frame-only.
     Panels are drawn at their REAL mock coordinates (seeds depend on x,y,w,h) then cropped, so they match docs/design/shots.
     Result: window.PARTS, window.SHEET_READY. Run: python3 tools/ui_bake/bake_game_parts.py -->

  x.putImageData(d,0,0);return c}
