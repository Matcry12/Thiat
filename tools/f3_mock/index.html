<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>F3 panel mock</title>
<style>
:root{--bg:rgb(15,17,22);--bg2:#1b1f27;--line:#2c323d;--tx:#d7dde6;--dim:#7d8795;--acc:#6cb6ff;--mod:#ffb454;--ok:#7fd48a;--bad:#ff7b72}
*{box-sizing:border-box}
body{margin:0;background:#0b0c0f;color:var(--tx);font:12px/1.35 system-ui,sans-serif}
#stage{position:relative;width:1152px;height:648px;overflow:hidden;margin:0 auto;background:#222}
canvas#game{position:absolute;inset:0}
#dock{position:absolute;top:8px;bottom:8px;width:380px;background:var(--bg);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;overflow:hidden}
#dock.right{right:8px}#dock.left{left:8px}
#dock.hidden{display:none}
.top{padding:8px 8px 0}
#q{width:100%;background:#0e1014;border:1px solid var(--line);color:var(--tx);border-radius:4px;padding:6px 8px 6px 26px;font:12px system-ui;outline:none}
#q:focus{border-color:var(--acc)}
.qw{position:relative;display:flex;gap:6px;align-items:center}.qw:before{content:"\2315";position:absolute;left:8px;top:5px;color:var(--dim);font-size:14px}
.qw .kb{position:absolute;right:10px;top:6px;color:var(--dim);font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 4px;pointer-events:none}
.ib{background:none;border:1px solid var(--line);color:var(--dim);border-radius:4px;width:28px;height:27px;cursor:pointer;flex:none}.ib:hover{color:var(--tx);border-color:var(--dim)}
.tabs{display:flex;gap:2px;margin-top:8px;border-bottom:1px solid var(--line)}
.tab{flex:1;text-align:center;padding:6px 0;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;user-select:none}
.tab:hover{color:var(--tx)}.tab.on{color:var(--tx);border-bottom-color:var(--acc)}
.tab small{color:var(--dim);font-size:10px;margin-left:3px}
#body{scroll-padding-top:62px;flex:1;overflow-y:auto;position:relative}
#body::-webkit-scrollbar{width:6px}#body::-webkit-scrollbar-thumb{background:#3a4150;border-radius:3px}
#banner{display:none;margin:6px 8px 0;padding:5px 8px;background:#3a2c12;border:1px solid #6b4d16;border-radius:4px;color:var(--mod)}
#banner i{display:block;height:3px;background:var(--mod);margin-top:4px;border-radius:2px;width:0}
.foot{border-top:1px solid var(--line);padding:6px 8px;background:#12141a}
.foot .r{display:flex;gap:6px;align-items:center;margin-top:5px}
.chip{border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--dim);cursor:pointer;user-select:none;background:none;font:inherit}
.chip:hover{color:var(--tx)}.chip.on{color:var(--mod);border-color:var(--mod)}
.btn{background:#262c37;border:1px solid #384050;color:var(--tx);border-radius:4px;padding:3px 9px;cursor:pointer;font:inherit}
.btn:hover{background:#303847;border-color:var(--acc)}.btn.pri{border-color:var(--acc);color:var(--acc)}.btn.on{background:#1f3a52;border-color:var(--acc);color:var(--acc)}
.btn[disabled]{opacity:.4;pointer-events:none}
.dim{color:var(--dim)}.mod{color:var(--mod)}
.cat{position:sticky;top:0;z-index:3;background:#1d222b;padding:6px 10px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);user-select:none}
.cat:hover{background:#232936}.cat .n{margin-left:auto;font-weight:400;color:var(--dim);font-size:11px}
.car{display:inline-block;width:10px;color:var(--dim);font-size:9px}
.sec{position:sticky;top:29px;z-index:2;background:#161a21;padding:4px 10px 4px 22px;cursor:pointer;display:flex;gap:6px;align-items:center;border-bottom:1px solid #1f242d;user-select:none}
.sec:hover{background:#1c212a}.sec .n{margin-left:auto;color:var(--dim);font-size:11px}
.badge{font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--dim)}
.badge.heavy{color:var(--mod);border-color:#6b4d16}.badge.file{color:var(--acc);border-color:#27506f}
.mdot{color:var(--mod);font-size:10px}
.grp{padding:5px 10px 2px 22px;color:var(--acc);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.row{display:flex;align-items:center;gap:5px;padding:2px 8px 2px 22px;min-height:24px}
.row:hover{background:#1a1f27}
.row .nm{flex:1 1 150px;min-width:48px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:ew-resize;color:var(--tx)}
.row.ch .nm{color:var(--mod)}.row.ch .nm:before{content:"\25CF ";font-size:8px;vertical-align:1px}
.row .nm:has(.sec-nm){display:flex;flex-direction:column;line-height:1.2;padding:2px 0}.row .nm .sec-nm{font-size:9px;display:block}.chip{white-space:nowrap}.row .sec-nm{color:var(--dim);font-size:10px;margin-right:2px}
input.num{width:58px;flex:none;background:#0e1014;border:1px solid #262c37;border-radius:3px;color:var(--tx);font:11px ui-monospace,Consolas,monospace;padding:2px 4px;text-align:right;outline:none}
input.num:hover{border-color:#3a4150}input.num:focus{border-color:var(--acc);background:#10151c}
input.num.pend{color:var(--mod);border-color:var(--mod)}
input[type=range]{flex:0 0 64px;width:64px;min-width:0;height:4px;accent-color:var(--acc);cursor:pointer}
.row .rs,.row .pn{width:14px;flex:none;text-align:center;cursor:pointer;color:#4a5262;user-select:none}
.row .rs{visibility:hidden;color:var(--mod)}.row.ch .rs{visibility:visible}.row .pn:hover{color:var(--tx)}.row .pn.on{color:#ffd24a}
.row .pendtxt{font-size:10px;color:var(--mod);flex:none}.row .ax{cursor:ew-resize;color:var(--acc);flex:none;font-size:11px}.row .ax:hover{color:#fff}
.sw{width:34px;height:20px;border:1px solid #384050;border-radius:3px;padding:0;background:none;flex:none}
.tg{width:30px;height:16px;border-radius:8px;background:#2c323d;position:relative;cursor:pointer;flex:none}
.tg:after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#8b94a3;transition:.1s}
.tg.on{background:#245b86}.tg.on:after{left:16px;background:#fff}
.sp{flex:1}
.acat{padding:8px 10px 4px;color:var(--dim);text-transform:uppercase;font-size:10px;letter-spacing:.06em}
.abtns{display:flex;flex-wrap:wrap;gap:5px;padding:0 10px 4px}
.abtn{display:inline-flex}.abtn .btn{padding:4px 9px;border-radius:4px 0 0 4px}.abtn .pin{border:1px solid #384050;border-left:0;border-radius:0 4px 4px 0;padding:0 5px;color:#4a5262;cursor:pointer;display:flex;align-items:center;font-size:11px;background:#1d222b}.abtn .pin:hover{color:var(--tx)}.abtn .pin.on{color:#ffd24a}
.abtn .tgs{margin-left:6px;font-size:10px;padding:0 5px;border-radius:8px;background:#2c323d;color:var(--dim)}.abtn .tgs.on{background:#1d4d2b;color:var(--ok)}
.btn.danger{border-color:#7a3430;color:#ff9a92}.btn.danger:hover{border-color:var(--bad);background:#3a1f1f}.btn.danger.sure{background:#7a2a26;color:#fff;border-color:var(--bad)}
.stsum{display:flex;align-items:center;gap:8px}.stb.fl{border-left:3px solid var(--acc)}
.arg{display:flex;gap:4px;align-items:center}.arg input{width:56px}
.stb{border-bottom:1px solid #1f242d}
.sth{display:flex;align-items:center;gap:6px;padding:5px 10px;cursor:pointer;user-select:none}.sth:hover{background:#1a1f27}
.sth b{font-weight:600}.sth .w{margin-left:auto;color:#4a5262;cursor:pointer;padding:0 4px}.sth .w.on{color:var(--acc)}.sth .w:hover{color:var(--tx)}
.stt{padding:0 10px 8px 26px;white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.4 ui-monospace,Consolas,monospace;color:#b8c2d0}
.sum{color:var(--dim);font:11px ui-monospace,monospace;margin-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.res{padding:5px 10px;display:flex;gap:8px;align-items:center;cursor:pointer}.res.sel{background:#1f2a38}.res:hover{background:#1a2230}
.res .k{font-size:10px;color:var(--acc);width:42px;flex:none;text-transform:uppercase}.res .p{color:var(--dim);font-size:11px;margin-left:auto}
.empty{padding:30px 20px;color:var(--dim);text-align:center;line-height:1.7}
.hint{padding:6px 10px;color:var(--dim);font-size:11px}
mark{background:none;color:var(--acc);font-weight:700}
.pinrow{padding:6px 10px 2px}
#watch{position:absolute;top:8px;width:268px;white-space:nowrap;overflow:hidden;background:rgba(12,14,18,.82);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font:11px/1.4 ui-monospace,Consolas,monospace;color:#c4cdd9;display:none;pointer-events:none}
#watch b{color:var(--acc);font-weight:600}#watch .l{color:var(--dim)}
#toast{position:absolute;left:480px;top:92px;width:268px;background:#12141a;border:1px solid var(--mod);padding:5px 10px;border-radius:6px;opacity:0;transition:.2s;pointer-events:none;color:var(--tx)}
#toast.on{opacity:1}
#typing{display:none;color:var(--mod)}
#pop{position:absolute;display:none;right:16px;bottom:62px;width:340px;background:#12151b;border:1px solid var(--acc);border-radius:6px;padding:10px;z-index:9}
#dock.left #pop{right:auto;left:16px}
#hintbar{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:10px;color:#fff8;pointer-events:none}
</style></head><body>
<div id="stage">
<canvas id="game" width="1152" height="648"></canvas>
<div id="watch"></div>
<div id="dock" class="right">
  <div class="top">
    <div class="qw"><input id="q" placeholder="Search settings, actions, status...  ( / )" autocomplete="off" spellcheck="false"><span class="kb">/</span></div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div id="banner"></div>
  <div id="body"></div>
  <div class="foot">
    <div style="display:flex;align-items:center;gap:8px"><button class="chip" id="chg"></button><span class="dim" id="kept">auto-kept for next run</span><span class="sp"></span><span id="typing">&#9000; typing: game keys paused</span></div>
    <div class="r"><button class="btn" id="wr"></button><button class="btn danger" id="rv">Clear overrides</button><span class="sp"></span><span class="dim" style="font-size:10px">F3 view &middot; / search &middot; Esc leave</span></div>
  </div>
  <div id="pop"></div>
</div>
<div id="toast"></div>
</div>
<script>
// ---------- mock data (names are the real ones from tuning_panel.gd / CLAUDE.md) ----------

const SEC=[];

S('Character','Player',[['speed','f',220,50,600],['wheel_settle','f',0.15,0,1],['hold_to_gather','b',true]]);
S('Character','Visual',[['shadow_on','b',true,0,0,{g:'Shadow'}],['shadow_min_scale','f',0.6,0,1,{g:'Shadow'}],['shadow_min_alpha','f',0.3,0,1,{g:'Shadow'}],
 ['front_half_angle_deg','f',55,10,90,{g:'Directional body'}],['facing_hysteresis_deg','f',8,0,30,{g:'Directional body'}],['landing_frames','i',2,0,8,{g:'Directional body'}],['lift_frames','i',2,0,8,{g:'Directional body'}],['hit_time_scale','f',1,0.2,3,{g:'Directional body'}],['flip_deadzone','f',0.15,0,1,{g:'Directional body'}],['directional_lift_px','f',2,0,10,{g:'Directional body'}]]);

S('Combat','Dummy',[['dummy_offset_x','f',120,-600,600],['dummy_offset_y','f',0,-600,600]]);
['Dummy','Player'].forEach(a=>S('Combat','Knockback '+a,[['enabled','b',true],['knockback_scale','f',1,0,3],['resistance','f',0,0,1],['decay_rate','f',14,1,40]]));
S('Boss','Boss',[['max_hp','f',1500,100,9999],['engage_radius','f',420,50,1200],['home_return_delay','f',2,0,5],['home_return_speed','f',220,10,600]]);

['slam','spread','charge','ring'].forEach((a,i)=>S('Boss','Boss '+a[0].toUpperCase()+a.slice(1),[['windup','f',0.7-i*.05,0,3],['damage','f',20+i*5,0,200],['cooldown','f',3,0,10],['radius','f',90+i*20,10,200]]));

 ['chunk_cells','i',32,4,128,{g:'Chunks',heavy:1}],['load_radius','i',2,0,6,{g:'Chunks'}],['unload_margin','i',1,0,4,{g:'Chunks'}],['chunks_per_frame','i',2,1,8,{g:'Chunks'}],
 ['land_share','f',0.45,0.05,0.9,{g:'Island',heavy:1}],['cont_radial','f',0.5,0,1,{g:'Island',heavy:1}],['cont_gain','f',1.4,0,4,{g:'Island',heavy:1}],['neck_boost','f',0.6,0,1.5,{g:'Island',heavy:1}],
 ['river_w_inland','f',1.5,0,4,{g:'Water',heavy:1}],['river_w_sea','f',3,0,6,{g:'Water',heavy:1}],['shore_cells','f',1,0,3,{g:'Water',heavy:1}],['shallow_tint_amount','f',0.4,0,1,{g:'Water'}],
 ['climate_octaves','i',4,1,8,{g:'Climate',heavy:1}],['biome_smooth_passes','i',2,0,6,{g:'Climate',heavy:1}],['calm_temp','f',0.5,0,1,{g:'Climate',heavy:1}],
 ['tree_fade_lo','f',0.3,0,1,{g:'Vegetation',heavy:1}],['tree_fade_hi','f',0.7,0,1,{g:'Vegetation',heavy:1}],['trees_on','b',true,0,0,{g:'Vegetation',heavy:1}],
 ['shade_strength','f',0.4,0,1,{g:'Looks'}],['foam_alpha','f',0.6,0,1,{g:'Looks'}],['shimmer_speed','f',1,0,5,{g:'Looks'}],['biome_map_alpha','f',0.5,0,1,{g:'Looks'}]],{heavy:1});

 ['a_temp','f',0.2+i/20,0,1.5,{g:'Climate',heavy:1}],['a_humid','f',0.5,0,1.5,{g:'Climate',heavy:1}],['a_rough','f',0.3,0,1.5,{g:'Climate',heavy:1}],

 ['tint_bright','f',1,0,2,{g:'Ground mix'}],['tint_sat','f',1,0,2,{g:'Ground mix'}],['tint_warm','f',0,-0.5,0.5,{g:'Ground mix'}],['map_colour','c','#4d8a3c',0,0,{g:'Ground mix'}]],{file:'data/biomes/'+b.toLowerCase().replace(' ','_')+'.tres'}));

S('UI','InventorySkin',[['slot_size','i',48,16,96],['font_size','i',12,8,24],['tooltip_alpha','f',0.9,0,1],['bar_colour','c','#c62828']]);

// actions: [cat,label,{toggle,arg,run}]
const ACT=[];
function A(cat,label,o={}){ACT.push({cat,label,...o})}
['Heal player','Hurt player 20','Kill player','Reset skill cd','Reset stats','Heal dummy'].forEach(l=>A('Player',l,l==='Kill player'?{danger:1}:{}));

 const c=$('#chg');c.className='chip'+(st.modOnly?' on':'');c.innerHTML='&#9679; '+ch.length+' overrides';c.title='show only changed settings';c.onclick=()=>{st.modOnly=!st.modOnly;st.tab='tune';st.q='';$('#q').value='';render()};
 const w=$('#wr');w.innerHTML='Write '+fv+' to .tres';w.disabled=!fv;w.className='btn'+(fv?' pri':'');w.title=[...files].join('\n');
 $('#rv').disabled=!ch.length;
 const nf=ch.length-fv;$('#kept').innerHTML=ch.length?(fv?fv+' to .tres':'')+(fv&&nf?', ':'')+(nf?nf+' scene-only (&#10064; copy)':'')+(st.stale.length?' &middot; <span id="stl" style="color:var(--bad);cursor:pointer" title="'+st.stale.map(x=>x.k+'  cfg '+x.cfg+' / file '+x.file).join('&#10;')+'&#10;click = drop">'+st.stale.length+' stale</span>':''):'no overrides';
 const sl=$('#stl');if(sl)sl.onclick=()=>{st.stale=[];toast('stale override dropped');foot()};

$('#wr').onclick=()=>{const files={};all().filter(x=>changed(x.p)&&x.s.file).forEach(x=>(files[x.s.file]=files[x.s.file]||[]).push(x.p.n));
 const pop=$('#pop');pop.style.display='block';pop.innerHTML='<b>Write to resource files</b><div class="dim" style="margin:4px 0 8px">Loads a fresh copy of each file, sets only the values listed, saves it. They leave the overrides.</div>'+Object.entries(files).map(([f,ps])=>'<div style="margin-bottom:4px"><span style="color:var(--acc)">'+f+'</span><br><span class="dim">'+ps.join(', ')+'</span></div>').join('')+'<div style="margin-top:8px;display:flex;gap:6px"><button class="btn pri" id="ok">Write</button><button class="btn" id="no">Cancel</button></div>';
 $('#no').onclick=()=>pop.style.display='none';$('#ok').onclick=()=>{all().filter(x=>x.s.file&&changed(x.p)).forEach(x=>x.p.d=clone(x.p.v));pop.style.display='none';toast('wrote '+Object.keys(files).length+' file(s)');refresh();render()}};

$('#q').oninput=e=>{st.q=e.target.value;st.sel=0;render()};
$('#q').onkeydown=e=>{e.stopPropagation();
 if(e.key==='Escape'){st.q='';e.target.value='';e.target.blur();render()}
 else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();st.sel=Math.max(0,st.sel+(e.key==='ArrowDown'?1:-1));render()}
 else if(e.key==='Enter'&&st.items){const it=st.items[st.sel];if(it&&it.k!=='Setting')pick(it)}};
function setMode(m){st.mode=m;$('#dock').className=st.side+(m==='full'?'':' hidden');liveStatus()}
// ---------- keys / game ----------
const keys=new Set();
document.addEventListener('keydown',e=>{
 if(/INPUT/.test(e.target.tagName)&&e.target.type!=='range'&&e.target.type!=='color')return;
 if(e.key==='F3'){e.preventDefault();setMode({full:'watch',watch:'off',off:'full'}[st.mode]);return}
 if(e.key==='/'){e.preventDefault();if(st.mode!=='full')setMode('full');$('#q').focus();return}
  keys.add(e.key.toLowerCase())});

document.addEventListener('focusin',foot);document.addEventListener('focusout',()=>setTimeout(foot,0));
const cv=$('#game'),g=cv.getContext('2d');

  const dx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),dy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);

 cam+=((st.mode==='full'?0:190)-cam)*.12;g.save();g.translate(cam,0);g.fillStyle='#2f6b2a';g.fillRect(-300,0,1700,648);
 for(let i=0;i<260;i++){g.fillStyle=i%3?'#2a6226':'#357a30';g.fillRect((i*97)%1152,(i*53)%648,3,3)}
 g.fillStyle='#8a5a34';g.beginPath();g.ellipse(430,320,170,120,.2,0,7);g.fill();g.fillStyle='#744a2a';g.beginPath();g.ellipse(430,330,120,80,.2,0,7);g.fill();
 g.fillStyle='#3a7fc4';g.fillRect(1090,0,300,648);g.fillStyle='#d8c58a';g.fillRect(1078,0,14,648);
 trees.forEach(([x,y])=>{g.fillStyle='#1d4a1c';g.beginPath();g.arc(x,y,34,0,7);g.fill();g.fillStyle='#2e7a2a';g.beginPath();g.arc(x-6,y-8,24,0,7);g.fill();g.fillStyle='#4a2f1a';g.fillRect(x-4,y+26,8,14)});
 g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(px,py+14,13,5,0,0,7);g.fill();g.fillStyle='#8aa0b8';g.fillRect(px-9,py-14,18,26);g.fillStyle='#c9ced6';g.fillRect(px-7,py-22,14,10);g.strokeStyle='#e8e8e8';g.lineWidth=3;g.beginPath();g.moveTo(px+10*st.face,py);g.lineTo(px+40*st.face,py-12);g.stroke();g.restore();
 // HUD
 for(let i=0;i<9;i++){g.fillStyle='rgba(30,36,50,.8)';g.fillRect(14+i*51,10,44,44);g.strokeStyle=i?'#4a5570':'#e8e0a0';g.lineWidth=2;g.strokeRect(14+i*51,10,44,44);g.fillStyle='#fff9';g.font='10px sans-serif';g.fillText(i+1,18+i*51,22)}
 g.fillStyle='#d8d8d8';g.fillRect(34,40,3,12);
 for(let i=0;i<3;i++){g.fillStyle='rgba(30,36,50,.8)';g.fillRect(14+i*51,582,44,40);g.strokeStyle='#4a5570';g.strokeRect(14+i*51,582,44,40)}
 g.fillStyle='#3a0d0d';g.fillRect(14,628,220,12);g.fillStyle='#c62828';g.fillRect(14,628,220*st.hp/100,12);
 // rebuild banner
 if(st.rebuild){const t=(performance.now()-st.rebuild.t0)/3700;const b=$('#banner');if(t>=1){st.rebuild=null;b.style.display='none'}else{const ms=performance.now()-st.rebuild.t0;b.innerHTML=ms<700?'&#10227; Rebuilding map&hellip; <span class="dim">('+st.rebuild.what+')</span>':'&#10003; Map rebuilt &middot; last rebuild 3.8 s <span class="dim">('+st.rebuild.what+')</span>'}}
 requestAnimationFrame(draw)}

render();setMode('full');draw();setTimeout(()=>{toast.long=1;toast('3 F3 overrides applied (tuning.cfg) - 1 stale skipped (file changed)');toast.long=0},300);
